<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warsztat 3D – modele do druku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF4;--surface:#FFFFFF;--ink:#171A24;--muted:#5A6073;--line:#D5D9E4;
  --stage-a:#F7F8FB;--stage-b:#E3E7F0;--grid:rgba(23,26,36,.07);--btn:#171A24;--btn-ink:#FFFFFF;--shadow:rgba(23,26,36,.85);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141C;--surface:#1B1F2B;--ink:#F2F3F8;--muted:#9AA1B8;--line:#2D3344;
  --stage-a:#232838;--stage-b:#161924;--grid:rgba(255,255,255,.06);--btn:#F2F3F8;--btn-ink:#12141C;--shadow:rgba(0,0,0,.9);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12141C;--surface:#1B1F2B;--ink:#F2F3F8;--muted:#9AA1B8;--line:#2D3344;
  --stage-a:#232838;--stage-b:#161924;--grid:rgba(255,255,255,.06);--btn:#F2F3F8;--btn-ink:#12141C;--shadow:rgba(0,0,0,.9);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#FF6A3D,#E5389B);display:block;box-shadow:3px 3px 0 var(--shadow)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:700 14px "DM Sans",sans-serif;background:var(--btn);color:var(--btn-ink);border:2px solid var(--btn);border-radius:12px;padding:9px 15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:focus-visible,[contenteditable="true"]:focus-visible,.drop:focus-visible,.del:focus-visible,#pw:focus-visible{outline:3px solid #3B82F6;outline-offset:3px}
.devonly{display:none}
body.dev .devonly{display:inline-block}
body.dev #devBtn{display:none}
.hero{padding:26px 0 34px;max-width:720px}
h1{font:800 clamp(34px,6vw,58px)/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0 0 14px}
.hero p{color:var(--muted);font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 28px;padding-bottom:70px}
.card{padding:5px;border-radius:28px;background:linear-gradient(140deg,var(--f1),var(--f2));box-shadow:8px 8px 0 var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--shadow)}
.in{background:var(--surface);border-radius:23px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.stage{position:relative;aspect-ratio:4/3.2;touch-action:pan-y;cursor:grab;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(circle at 50% 40%,var(--stage-a),var(--stage-b))}
.stage:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.del{display:none;position:absolute;right:10px;top:10px;min-width:32px;height:32px;padding:0 10px;border-radius:16px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:700 14px "DM Sans";cursor:pointer;align-items:center;justify-content:center}
body.dev .del{display:inline-flex}
.del.arm{background:#DC2626;border-color:#DC2626;color:#fff}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
h3{font:700 21px/1.2 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
.desc{margin:0;color:var(--muted);font-size:15px}
.foot{margin-top:auto;padding-top:12px;border-top:2px solid var(--line)}
.price{font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.price small{font-size:17px;font-weight:700}
body.dev [data-ed]{outline:2px dashed var(--line);outline-offset:3px;border-radius:4px;min-width:2ch;display:inline-block}
body.dev h3[data-ed],body.dev .desc[data-ed]{display:block}
body.dev [data-ed]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.drop{display:none;border:4px dashed var(--muted);border-radius:28px;min-height:360px;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer;color:var(--muted);background:transparent;font:inherit}
body.dev .drop{display:flex}
.drop b{font:700 22px "Bricolage Grotesque";color:var(--ink)}
.drop.over{border-color:#E5389B;color:var(--ink)}
#empty{grid-column:1/-1;font-size:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal[hidden]{display:none}
.box{background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--shadow)}
.box b{font:700 20px "Bricolage Grotesque"}
#pw{font:500 18px "DM Sans";padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:#DC2626;font-size:14px;min-height:20px}
.row{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;max-width:90vw;display:none;z-index:30}
@media (max-width:520px){.grid{gap:30px 20px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i></i>Warsztat 3D</div>
    <div class="top">
      <button class="btn ghost" id="devBtn">Tryb deweloperski</button>
      <button class="btn devonly" id="add">Dodaj plik .3mf</button>
      <button class="btn devonly" id="exp">Pobierz models.json</button>
      <button class="btn ghost devonly" id="rst">Wyczyść szkic</button>
      <button class="btn ghost devonly" id="out">Wyjdź</button>
    </div>
  </header>
  <section class="hero">
    <h1>Gotowe modele do druku 3D</h1>
    <p>Obróć model w podglądzie 3D i wybierz coś dla siebie.</p>
  </section>
  <main class="grid" id="grid">
    <p id="empty" hidden>Nowe modele pojawią się tu wkrótce.</p>
    <button class="drop" id="drop" type="button"><b>Upuść tu pliki .3mf</b><span>albo kliknij i wybierz z dysku.<br>Tytuł, opis i cenę wpiszesz bezpośrednio na karcie.</span></button>
  </main>
</div>
<input type="file" id="file" accept=".3mf" multiple hidden>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-label="Tryb deweloperski">
  <b>Tryb deweloperski</b>
  <input id="pw" type="password" inputmode="numeric" placeholder="Hasło" autocomplete="off">
  <div class="err" id="err" role="alert"></div>
  <div class="row"><button class="btn" id="pwOk">Włącz</button><button class="btn ghost" id="pwNo">Anuluj</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s), grid=$('#grid'), dropTile=$('#drop'), fileIn=$('#file');
const PASSWORD='2905';
const FR=[['#FF6A3D','#E5389B'],['#14B8A6','#3B82F6'],['#FACC15','#FB7C2B'],['#8B5CF6','#EC4899'],['#22C55E','#06B6D4']];
let models=[],nCards=0,viewers=[],dev=false,saveT;
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
function arm(btn,label,fn){ // pierwsze kliknięcie pyta, drugie wykonuje
  if(btn.dataset.arm){clearTimeout(+btn.dataset.arm);fn();return}
  const old=btn.textContent;btn.textContent=label;btn.classList.add('arm');
  btn.dataset.arm=setTimeout(()=>{delete btn.dataset.arm;btn.textContent=old;btn.classList.remove('arm')},3000);
}

/* ---------- szkic w przeglądarce (IndexedDB) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('warsztat3d',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbGet=async()=>{const d=await idb();return new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('draft');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})};
const dbSet=async v=>{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'draft')};
const dbDel=async()=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('k','readwrite');t.objectStore('k').delete('draft');t.oncomplete=ok;t.onerror=ok})};
const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>dbSet(models).catch(()=>{}),300)};

/* ---------- parser 3MF ---------- */
const T=s=>{const m=new THREE.Matrix4();if(!s)return m;const a=s.trim().split(/\s+/).map(Number);
  return m.set(a[0],a[3],a[6],a[9],a[1],a[4],a[7],a[10],a[2],a[5],a[8],a[11],0,0,0,1)};
async function load3mf(buf){
  const zip=await JSZip.loadAsync(buf);
  const names=Object.keys(zip.files).filter(n=>/\.model$/i.test(n));
  if(!names.length)throw new Error('brak geometrii modelu w pliku');
  const docs={};
  for(const n of names)docs[n]=new DOMParser().parseFromString(await zip.files[n].async('string'),'application/xml');
  const rootName=docs['3D/3dmodel.model']?'3D/3dmodel.model':names[0], root=docs[rootName], objs={};
  for(const n in docs)for(const o of docs[n].getElementsByTagName('object'))objs[n+'|'+o.getAttribute('id')]=o;
  const pos=[];
  const emit=(path,id,mat)=>{
    const o=objs[path+'|'+id];if(!o)return;
    const mesh=o.getElementsByTagName('mesh')[0];
    if(mesh){
      const vs=[...mesh.getElementsByTagName('vertex')].map(v=>new THREE.Vector3(+v.getAttribute('x'),+v.getAttribute('y'),+v.getAttribute('z')).applyMatrix4(mat));
      for(const t of mesh.getElementsByTagName('triangle'))for(const k of ['v1','v2','v3']){const v=vs[+t.getAttribute(k)];if(v)pos.push(v.x,v.y,v.z)}
    }
    for(const c of o.getElementsByTagName('component')){
      const p=c.getAttribute('p:path'), cp=p?p.replace(/^\//,''):path;
      emit(cp,c.getAttribute('objectid'),mat.clone().multiply(T(c.getAttribute('transform'))));
    }
  };
  const items=[...root.getElementsByTagName('item')];
  if(items.length)items.forEach(i=>emit(rootName,i.getAttribute('objectid'),T(i.getAttribute('transform'))));
  else[...root.getElementsByTagName('object')].forEach(o=>emit(rootName,o.getAttribute('id'),new THREE.Matrix4()));
  if(!pos.length)throw new Error('plik nie zawiera trójkątów');
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  return g;
}
const toB64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)).buffer;

/* ---------- podgląd 3D ---------- */
const mesh=g=>new THREE.Mesh(g);
const SHAPES={
  knot:()=>new THREE.TorusKnotGeometry(1,.32,160,24),
  vase:()=>{const p=[];for(let i=0;i<=24;i++){const t=i/24;p.push(new THREE.Vector2(.55+.35*Math.sin(t*Math.PI*1.6)+.1*t,t*2.6))}return new THREE.LatheGeometry(p,48)},
  hex:()=>new THREE.CylinderGeometry(1.2,1.2,1,6),
  gem:()=>new THREE.IcosahedronGeometry(1.3,0)
};
async function buildObj(m){
  if(m.b64){const o=mesh(await load3mf(fromB64(m.b64)));o.rotation.x=-Math.PI/2;const w=new THREE.Group();w.add(o);return w}
  return mesh(SHAPES[m.shape||'knot']());
}
function makeViewer(stage,object,color,flat){
  const canvas=stage.querySelector('canvas');
  const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(35,1,.1,50);cam.position.set(0,1.1,6.2);cam.lookAt(0,0,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0x778899,.9));
  const d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(3,5,4);scene.add(d);
  object.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({color,roughness:.5,metalness:.05,flatShading:!!flat,side:THREE.DoubleSide})});
  const box=new THREE.Box3().setFromObject(object), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  const piv=new THREE.Group();object.position.sub(c);piv.add(object);piv.scale.setScalar(3/Math.max(s.x,s.y,s.z));
  const spin=new THREE.Group();spin.add(piv);spin.rotation.x=.25;scene.add(spin);
  const v={r,scene,cam,spin,vis:false,drag:false,w:0,h:0};
  const fit=()=>{const w=stage.clientWidth,h=stage.clientHeight;if(w&&(w!==v.w||h!==v.h)){v.w=w;v.h=h;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}};
  const ro=new ResizeObserver(fit);ro.observe(stage);fit();
  const io=new IntersectionObserver(e=>v.vis=e[0].isIntersecting);io.observe(stage);
  let lx,ly;
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('.del'))return;v.drag=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!v.drag)return;spin.rotation.y+=(e.clientX-lx)*.012;spin.rotation.x=Math.max(-1.2,Math.min(1.2,spin.rotation.x+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY});
  ['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,()=>v.drag=false));
  v.dispose=()=>{ro.disconnect();io.disconnect();r.dispose();r.forceContextLoss();viewers=viewers.filter(x=>x!==v)};
  viewers.push(v);return v;
}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){requestAnimationFrame(loop);for(const v of viewers)if(v.vis){if(!v.drag&&!still)v.spin.rotation.y+=.006;v.r.render(v.scene,v.cam)}})();

/* ---------- karty ---------- */
const refreshEmpty=()=>{$('#empty').hidden=models.length>0};
function addCard(m){
  const [f1,f2]=FR[nCards++%FR.length];
  const el=document.createElement('article');el.className='card';el.style.setProperty('--f1',f1);el.style.setProperty('--f2',f2);
  el.innerHTML=`<div class="in"><div class="stage" aria-label="Podgląd 3D"><canvas></canvas><button class="del" title="Usuń model" aria-label="Usuń model">×</button><span class="hint">Przeciągnij, by obrócić</span></div>
  <div class="body"><h3 data-ed data-k="title" data-ph="Tytuł"></h3><p class="desc" data-ed data-k="desc" data-ph="Opis modelu"></p>
  <div class="foot"><div class="price"><span data-ed data-k="price" data-ph="0"></span> <small>zł</small></div></div></div></div>`;
  el.querySelectorAll('[data-k]').forEach(n=>{
    n.textContent=m[n.dataset.k]||'';n.contentEditable=dev;
    n.addEventListener('input',()=>{m[n.dataset.k]=n.textContent;save()});
    n.addEventListener('keydown',e=>{if(e.key==='Enter'&&n.tagName!=='P'){e.preventDefault()}});
  });
  grid.insertBefore(el,dropTile);
  let v;
  buildObj(m).then(o=>{v=makeViewer(el.querySelector('.stage'),o,new THREE.Color(m.color||'#E5389B'),m.flat)})
    .catch(()=>{el.querySelector('.hint').textContent='Nie udało się wczytać modelu'});
  const del=el.querySelector('.del');
  del.onclick=()=>arm(del,'Usuń?',()=>{models.splice(models.indexOf(m),1);if(v)v.dispose();el.remove();save();refreshEmpty()});
}

/* ---------- tryb deweloperski ---------- */
function setDev(on){
  dev=on;document.body.classList.toggle('dev',on);
  document.querySelectorAll('[data-ed]').forEach(n=>n.contentEditable=on);
}
const modal=$('#modal'), pw=$('#pw');
const openModal=()=>{$('#err').textContent='';pw.value='';modal.hidden=false;pw.focus()};
const closeModal=()=>modal.hidden=true;
const tryPw=()=>{if(pw.value===PASSWORD){closeModal();setDev(true);toast('Tryb deweloperski włączony. Przeciągnij pliki .3mf na stronę albo kliknij tekst, by go zmienić.')}else{$('#err').textContent='Błędne hasło.';pw.select()}};
$('#devBtn').onclick=openModal;$('#pwOk').onclick=tryPw;$('#pwNo').onclick=closeModal;
pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryPw();if(e.key==='Escape')closeModal()});
$('#out').onclick=()=>setDev(false);

async function handle(files){
  for(const f of files){
    if(!/\.3mf$/i.test(f.name)){toast('Pominięto '+f.name+': to nie jest plik .3mf.');continue}
    try{
      const buf=await f.arrayBuffer();await load3mf(buf);
      const m={id:uid(),title:f.name.replace(/\.3mf$/i,''),desc:'',price:'',color:'#E5389B',b64:toB64(buf)};
      models.push(m);addCard(m);save();refreshEmpty();
      toast('Dodano „'+m.title+'”. Kliknij tytuł, opis lub cenę, by je wpisać.');
    }catch(e){toast('Nie udało się wczytać '+f.name+': '+e.message)}
  }
}
$('#add').onclick=dropTile.onclick=()=>fileIn.click();
fileIn.onchange=()=>{handle([...fileIn.files]);fileIn.value=''};
['dragover','dragenter'].forEach(t=>addEventListener(t,e=>{if(!dev)return;e.preventDefault();dropTile.classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{if(!dev)return;e.preventDefault();dropTile.classList.remove('over')}));
addEventListener('drop',e=>{if(dev&&e.dataTransfer)handle([...e.dataTransfer.files])});

$('#exp').onclick=()=>{
  const b=new Blob([JSON.stringify(models.map(({id,...r})=>r))],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='models.json';a.click();
  toast('Wgraj models.json do repozytorium obok index.html i zrób commit, żeby zmiany zobaczyli wszyscy.');
};
const rst=$('#rst');
rst.onclick=()=>arm(rst,'Na pewno?',async()=>{try{await dbDel()}catch(e){}location.reload()});

/* ---------- start: szkic > models.json > przykłady ---------- */
const DEFAULTS=[
 {title:'Uchwyt na słuchawki Helix',desc:'Skręcony w supeł stojak na biurko. Stabilna podstawa, wydruk bez podpór.',price:'49',shape:'knot',color:'#FF6A3D'},
 {title:'Wazon Fala',desc:'Cienkościenny wazon drukowany w trybie wazy. Jedna ściana, gładka faktura.',price:'79',shape:'vase',color:'#14B8A6'},
 {title:'Organizer Heksagon',desc:'Modułowy pojemnik na śrubki i drobiazgi. Łączy się w plaster miodu.',price:'29',shape:'hex',flat:true,color:'#FACC15'},
 {title:'Figurka Kryształ',desc:'Niskopoligonowa bryła na półkę. Kolor ustawisz na etapie slicera.',price:'35',shape:'gem',flat:true,color:'#8B5CF6'}
];
(async function init(){
  let d;try{d=await dbGet()}catch(e){}
  if(Array.isArray(d))models=d;
  else{
    let got=false;
    try{const r=await fetch('models.json',{cache:'no-cache'});if(r.ok){const j=await r.json();if(Array.isArray(j)){models=j;got=true}}}catch(e){}
    if(!got)models=DEFAULTS.map(x=>({...x}));
  }
  models.forEach(m=>m.id=m.id||uid());
  models.forEach(addCard);refreshEmpty();
})();
</script>
</body>
</html>
